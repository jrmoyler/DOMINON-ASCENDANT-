name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, and package
        working-directory: web
        run: |
          npm ci
          npm test
          npm run package

      - name: Zip web build
        run: cd web/dist && zip -r ../../DominionAscendant-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: DominionAscendant-${{ github.ref_name }}
          path: |
            web/dist-single/DominionAscendant.html
            DominionAscendant-web.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Play offline:** download `DominionAscendant.html` and double-click it (modern Chrome, Edge, Firefox or Safari with WebGL).
            **Self-host:** unzip `DominionAscendant-web.zip` onto any static host (installable as an app over HTTPS).
          files: |
            web/dist-single/DominionAscendant.html
            DominionAscendant-web.zip
