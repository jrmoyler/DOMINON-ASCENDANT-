<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2526"/>
      <stop offset="1" stop-color="#0c1112"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dba6"/>
      <stop offset=".55" stop-color="#d6bc80"/>
      <stop offset="1" stop-color="#9c8250"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#enamel)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#d6bc80" stroke-opacity=".55" stroke-width="6"/>
  <!-- ascending tower: stepped ziggurat with spire -->
  <g fill="url(#brass)">
    <rect x="248" y="74" width="16" height="70"/>
    <path d="M256 60 l10 22 h-20z"/>
    <rect x="224" y="144" width="64" height="50"/>
    <rect x="196" y="194" width="120" height="58"/>
    <rect x="164" y="252" width="184" height="66"/>
    <rect x="128" y="318" width="256" height="76"/>
    <rect x="104" y="394" width="304" height="20"/>
  </g>
  <!-- the // monogram cut through the tower -->
  <g stroke="#101617" stroke-width="22" stroke-linecap="square">
    <line x1="214" y1="388" x2="262" y2="226"/>
    <line x1="262" y1="388" x2="310" y2="226"/>
  </g>
  <g fill="#101617">
    <rect x="234" y="156" width="10" height="20"/>
    <rect x="268" y="156" width="10" height="20"/>
  </g>
</svg>
